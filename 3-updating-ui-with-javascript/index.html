<html>
  <body>
    <div id="app"></div>
    <script type"text/javascript">
        // 1. Select the div element with 'app' id
        const app = document.getElementById('app');

        // 2. Create a new H1 element
        const h1 = document.createElement('h1');
    
        // 3. Create a new text node for the H1 element
        // const text = 'Develop. Preview. Ship.';
        const headerContent = document.createTextNode('Develop. Preview. Ship.');
    
        // 4. Append the text to the H1 element
        h1.appendChild(headerContent);
    
        // 5. Place the H1 element inside the div
        app.appendChild(h1);

    </script>
  </body>
</html>
